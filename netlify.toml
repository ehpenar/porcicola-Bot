# Porcicola Ops — deploy desde la carpeta plataforma/ (TanStack Start + Nitro)
[build]
  base = "plataforma"
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  # El valor demo de ENLACE_API_KEY también aparece en el JS del cliente (fallback).
  # Si lo marcas "secret" en el dashboard, el scan falla → omitimos esas keys del scan.
  SECRETS_SCAN_OMIT_KEYS = "ENLACE_API_KEY,STOCK_WEBHOOK_URL,VITE_ENLACE_API_KEY"

# Env recomendadas en el dashboard (NO marques VITE_* como secret):
#   VITE_DEMO_MODE=true
#   ENLACE_API_KEY=porcicola-enlace-demo   ← mejor SIN secret en demo
#   STOCK_WEBHOOK_URL=https://ehpenar.app.n8n.cloud/webhook/b4d0784c-8649-4c78-bc0d-285b2476296e
